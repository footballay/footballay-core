name: Build Image and Trigger Deploy

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip Gradle tests"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      trigger_private:
        description: "Trigger footballay-core-action after GHCR push"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/footballay/footballay-core

jobs:
  build-test:
    name: Test and bootJar
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image: ${{ steps.meta.outputs.image }}
      app_version: ${{ steps.meta.outputs.app_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image metadata
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          TS="$(date -u +%Y%m%d-%H%M%S)"
          IMAGE_TAG="${TS}-${SHORT_SHA}"
          APP_VERSION="$(sed -n "s/^version = '\([^']*\)'.*/\1/p" build.gradle | head -n1)"

          [ -n "${APP_VERSION}" ] || {
            echo "app version is empty"
            exit 1
          }

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE_NAME}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"

          {
            echo "IMAGE_TAG=${IMAGE_TAG}"
            echo "IMAGE=${IMAGE_NAME}:${IMAGE_TAG}"
          } >> "$GITHUB_ENV"

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Run tests
        if: github.event.inputs.skip_tests == 'false'
        run: ./gradlew test --build-cache

      - name: Build bootJar
        run: ./gradlew bootJar --build-cache

      - name: Show bootJar
        run: ls -lh build/libs

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-html-report
          path: build/reports/tests/test
          if-no-files-found: ignore

      - name: Upload bootJar
        uses: actions/upload-artifact@v4
        with:
          name: bootjar
          path: build/libs/*.jar

  docker-build-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: build-test

    outputs:
      image: ${{ needs.build-test.outputs.image }}
      image_tag: ${{ needs.build-test.outputs.image_tag }}
      app_version: ${{ needs.build-test.outputs.app_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download bootJar
        uses: actions/download-artifact@v4
        with:
          name: bootjar
          path: build/libs

      - name: Show downloaded bootJar
        run: ls -lh build/libs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ needs.build-test.outputs.image }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write summary
        run: |
          {
            echo "## Docker image pushed"
            echo ""
            echo "- Image: \`${{ needs.build-test.outputs.image }}\`"
            echo "- Tag: \`${{ needs.build-test.outputs.image_tag }}\`"
            echo "- App version: \`${{ needs.build-test.outputs.app_version }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  trigger-private:
    name: Trigger private deploy repo
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.event.inputs.trigger_private == 'true'

    steps:
      - name: Trigger footballay-core-action
        env:
          TOKEN: ${{ secrets.ACTIONS_RELAY_TOKEN }}
          IMAGE: ${{ needs.docker-build-push.outputs.image }}
          IMAGE_TAG: ${{ needs.docker-build-push.outputs.image_tag }}
          APP_VERSION: ${{ needs.docker-build-push.outputs.app_version }}
          SKIP_TESTS: ${{ github.event.inputs.skip_tests }}
        run: |
          PAYLOAD="$(jq -n \
            --arg image "$IMAGE" \
            --arg image_tag "$IMAGE_TAG" \
            --arg app_version "$APP_VERSION" \
            --arg commit_sha "${GITHUB_SHA}" \
            --arg source_repo "${GITHUB_REPOSITORY}" \
            --arg source_run_id "${GITHUB_RUN_ID}" \
            --arg skip_tests "$SKIP_TESTS" \
            '{
              event_type: "deploy_request",
              client_payload: {
                image: $image,
                image_tag: $image_tag,
                app_version: $app_version,
                commit_sha: $commit_sha,
                source_repo: $source_repo,
                source_run_id: $source_run_id,
                skip_tests: $skip_tests
              }
            }'
          )"

          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TOKEN}" \
            https://api.github.com/repos/Footballay/footballay-core-action/dispatches \
            -d "${PAYLOAD}"